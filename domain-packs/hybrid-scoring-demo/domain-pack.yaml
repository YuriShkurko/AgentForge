name: hybrid-scoring-demo
display_name: Hybrid Scoring Demo
version: 0.1.0

domain:
  domain_name: Hybrid Scoring Demo
  app_type: ingestion_scoring_pipeline
  target_users:
    - developer
    - agentforge_evaluator
  product_purpose: >
    Demonstrate the reusable Product Shell modules shared by Business Insight and
    AI Job Radar: provider/adapter interfaces, run history, deterministic
    scoring/explanation, operations UI, and a notification/action loop stub — all
    without live LLM or paid API dependency.
  main_user_goals:
    - ingest_fixture_records_through_provider_interface
    - normalize_raw_records_into_stable_dto
    - score_records_deterministically_with_explanation
    - view_run_history_and_scored_results
    - record_an_action_decision_without_external_delivery

app_archetype: ingestion_scoring_pipeline

required_shell_modules:
  - pipeline
  - provider_adapter
  - scoring_explanation
  - operations_ui
  - persistence
  - test

optional_shell_modules:
  - notification_action
  - triage_ui
  - agent_runtime   # command-panel stub only; no live LLM required
  - workspace       # generic Dashboard/Workspace Module with persisted widgets

customization:
  app:
    subtitle: Review fixture or imported records, run deterministic scoring, preview notifications, and pin agent results into a persisted workspace.
    target_user_label: demo operator
    workflow_label: Review workflow
  agent_starters:
    - score the records
    - show best records
    - pin the scored records to the workspace
  workspace:
    empty_state: Ask the agent to pin scored records, notification previews, or action history.
    widget_label: widgets
    pinned_label: Pinned review context
  scoring:
    record_label:
      singular: record
      plural: records
    criteria_labels:
      - Fit
      - Priority
      - Risk
    review_queue_label: Scored Records
    notification_label: Notification Previews
    sample_data_label: demo records

agent_runtime:
  enabled: true
  provider_mode: scripted
  scripted_fixture_path: backend/app/agent/providers.py
  conversation_persistence:
    enabled: true
    tables:
      - conversations
      - conversation_messages
  streaming:
    enabled: true
    endpoint: /agent/chat/stream
    events:
      - message_start
      - text_delta
      - tool_call
      - tool_result
      - error
      - done
  guardrails:
    reject_empty_message: true
    unsafe_or_irrelevant_placeholder: documented_only
  tools:
    - name: run_ingest
      purpose: Ingest deterministic fixture records through the provider interface.
      input_schema: {}
      output_schema:
        fields: [run_id, raw_records_inserted, normalized_inserted]
    - name: score_records
      purpose: Score normalized records with deterministic heuristics.
      input_schema:
        rescore:
          type: boolean
          required: false
          default: false
      output_schema:
        fields: [scores_written, rescore]
    - name: get_scored_records
      purpose: Return the highest-scored records.
      input_schema:
        limit:
          type: integer
          required: false
          default: 3
      output_schema:
        fields: [records]
    - name: create_notification_preview
      purpose: Create preview-only notification payloads.
      input_schema: {}
      output_schema:
        fields: [previews_written]
    - name: list_action_history
      purpose: Return recent triage action history.
      input_schema:
        limit:
          type: integer
          required: false
          default: 5
      output_schema:
        fields: [events]
    - name: pin_widget
      purpose: Persist a compatible tool result as a workspace widget.
      input_schema:
        widget_type:
          type: string
          required: true
          choices: [summary_card, ranking_list, score_table, run_history_list, notification_preview_card, action_history_list]
        title:
          type: string
          required: true
        source_tool:
          type: string
          required: true
        data:
          type: object
          required: true
      output_schema:
        fields: [pinned, widget]
    - name: list_widgets
      purpose: List persisted workspace widgets.
      input_schema: {}
      output_schema:
        fields: [widgets]
    - name: remove_widget
      purpose: Remove a persisted workspace widget by UUID.
      input_schema:
        widget_id:
          type: uuid
          required: true
      output_schema:
        fields: [removed, widget_id]
    - name: reorder_widgets
      purpose: Set deterministic workspace widget order using all current widget IDs.
      input_schema:
        widget_ids:
          type: array
          required: true
      output_schema:
        fields: [reordered, widget_ids, widgets]
  scripted_turns:
    - match: ingest
      tool_calls:
        - name: run_ingest
          arguments: {}
      final_text: I ingested fixture records through the provider interface.
    - match: score
      tool_calls:
        - name: score_records
          arguments:
            rescore: false
      final_text: I scored the records using the deterministic scoring adapter.
    - match: preview
      tool_calls:
        - name: create_notification_preview
          arguments: {}
      final_text: I created preview-only notification payloads for scored records.
    - match: pin scored records
      tool_calls:
        - name: get_scored_records
          arguments:
            limit: 3
        - name: pin_widget
          arguments:
            widget_type: ranking_list
            title: Top scored records
            source_tool: get_scored_records
            __from_tool: get_scored_records
      final_text: I pinned the scored records to the workspace.

workspace:
  enabled: true
  persistence:
    table_name: workspace_widgets
    fields: [id, widget_type, title, source_tool, data, position, metadata, created_at, updated_at]
  default_layout: []
  remove_enabled: true
  reorder_enabled: true
  empty_state: No widgets yet. Ask the agent to pin scored records to the workspace.
  frontend_surface: workspace_panel

tool_widget_compatibility:
  get_scored_records: [ranking_list, score_table]
  get_run_history: [run_history_list, summary_card]
  create_notification_preview: [notification_preview_card, summary_card]
  list_action_history: [action_history_list, summary_card]
  score_records: [summary_card]
  run_ingest: [summary_card]

widgets:
  - widget_type: summary_card
    renderer: SummaryCard
    compatible_source_tools: [get_run_history, create_notification_preview, list_action_history, score_records, run_ingest]
    section: workspace
    expected_data_shape: Small object payload rendered as key/value summary rows.
    empty_state: No summary data.
    implementation_status: planned
  - widget_type: ranking_list
    renderer: RankingList
    compatible_source_tools: [get_scored_records]
    section: workspace
    expected_data_shape: Records array with title, fit, label, and recommendation fields.
    empty_state: No ranked records.
    implementation_status: planned
  - widget_type: score_table
    renderer: ScoreTable
    compatible_source_tools: [get_scored_records]
    section: workspace
    expected_data_shape: Records array rendered as compact score rows.
    empty_state: No score rows.
    implementation_status: planned
  - widget_type: run_history_list
    renderer: RunHistoryList
    compatible_source_tools: [get_run_history]
    section: workspace
    expected_data_shape: Runs array with provider_name, status, and stats.
    empty_state: No runs.
    implementation_status: planned
  - widget_type: notification_preview_card
    renderer: NotificationPreviewCard
    compatible_source_tools: [create_notification_preview]
    section: workspace
    expected_data_shape: Preview creation result or preview payload summary.
    empty_state: No notification preview data.
    implementation_status: planned
  - widget_type: action_history_list
    renderer: ActionHistoryList
    compatible_source_tools: [list_action_history]
    section: workspace
    expected_data_shape: Events array with action_type, status, record_id, and created_at.
    empty_state: No action history.
    implementation_status: planned

# ---------------------------------------------------------------------------
# Capabilities
# ---------------------------------------------------------------------------

capabilities:
  - name: ingest_records
    purpose: Load fixture records through the provider interface and normalize them into the domain DTO.
    input_summary: POST /ingest — no request body; uses configured provider (fixture by default).
    output_shape:
      fields: [raw_records_inserted, normalized_inserted, run_id]
    mutates_state: true
    data_mode: fixture_provider
    deterministic_test_safe: true
    implementation_status: planned

  - name: list_normalized_records
    purpose: Return recently normalized records for operational inspection.
    input_summary: GET /records — optional limit query parameter.
    output_shape:
      fields: [id, external_id, source, title, category, value, ingested_at, raw_payload]
    mutates_state: false
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: score_records
    purpose: Score normalized records using deterministic heuristics and write explanation output.
    input_summary: POST /score — optional rescore boolean.
    output_shape:
      fields: [scores_written, rescore]
    mutates_state: true
    data_mode: deterministic_heuristics
    deterministic_test_safe: true
    implementation_status: planned

  - name: list_scored_records
    purpose: Return records with their latest score, ordered by score descending.
    input_summary: GET /records/scored — optional limit and undecided boolean filter.
    output_shape:
      fields: [record, score]
      record_fields: [id, external_id, source, title, category, ingested_at]
      score_fields: [fit, label, recommendation, explanation]
      explanation_fields: [fit_score, summary, drivers, risks, recommendation]
    mutates_state: false
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: list_runs
    purpose: Return provider run history with status, stats, and errors.
    input_summary: GET /runs — optional limit query parameter.
    output_shape:
      fields: [id, provider_name, started_at, finished_at, status, stats, error]
    mutates_state: false
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: record_action
    purpose: Record a user action decision for a scored record without external delivery.
    input_summary: POST /records/{record_id}/action — body with action_type enum (accept/skip/save).
    output_shape:
      fields: [ok, record_id, action_type, status]
    mutates_state: true
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: create_notification_previews
    purpose: Generate deterministic preview-only notification payloads from scored records.
    input_summary: POST /notifications/previews — no request body.
    output_shape:
      fields: [previews_written]
    mutates_state: true
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: list_notification_previews
    purpose: Return preview payloads with score summary, reasons, risks, available actions, and current action state.
    input_summary: GET /notifications/previews — optional limit query parameter.
    output_shape:
      fields: [id, record_id, title, score, label, recommendation, summary, drivers, risks, available_actions, delivery_channel, delivery_status, action]
    mutates_state: false
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: list_action_history
    purpose: Return append-only action history events for triage/audit visibility.
    input_summary: GET /actions/history — optional limit query parameter.
    output_shape:
      fields: [id, record_id, action_type, status, created_at]
    mutates_state: false
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: agent_chat
    purpose: Accept a user message, run the scripted Agent Runtime provider, execute deterministic tools, and persist the conversation.
    input_summary: POST /agent/chat — message and optional conversation_id.
    output_shape:
      fields: [conversation_id, assistant_message, messages, tool_events]
    mutates_state: true
    data_mode: scripted_provider_plus_database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: get_agent_conversation
    purpose: Return persisted conversation messages for the Agent Runtime Module.
    input_summary: GET /agent/conversations/{conversation_id}
    output_shape:
      fields: [conversation_id, messages]
    mutates_state: false
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

  - name: workspace_widgets
    purpose: Create, list, remove, and reorder persisted generic workspace widgets.
    input_summary: GET/POST/DELETE /workspace/widgets and POST /workspace/widgets/reorder.
    output_shape:
      fields: [widgets, widget, removed, reordered]
    mutates_state: true
    data_mode: database
    deterministic_test_safe: true_with_seeded_db
    implementation_status: planned

# ---------------------------------------------------------------------------
# UI Surfaces
# ---------------------------------------------------------------------------

ui_surfaces:
  - surface_type: run_history_table
    renderer: RunHistoryTable
    data_source: list_runs
    section: operations
    expected_data_shape: ProviderRun rows with provider_name, status, started_at, finished_at, stats, error.
    empty_state: No runs yet. Use the Ingest button to start.

  - surface_type: scored_records_table
    renderer: ScoredRecordsTable
    data_source: list_scored_records
    section: results
    expected_data_shape: ScoredRecord rows with title, category, fit score, label, recommendation summary.
    empty_state: No scored records. Run ingest then score.

  - surface_type: action_status_column
    renderer: ActionStatusBadge
    data_source: record_action
    section: results
    expected_data_shape: action_type and status (pending/accepted/skipped/saved).
    empty_state: No action taken.

  - surface_type: notification_preview_panel
    renderer: NotificationPreviewPanel
    data_source: list_notification_previews
    section: notifications
    expected_data_shape: Preview cards with title, score, summary, risks, available actions, and current action state.
    empty_state: No notification previews. Score records, then preview notifications.

  - surface_type: action_history_panel
    renderer: ActionHistoryPanel
    data_source: list_action_history
    section: triage
    expected_data_shape: Append-only action events with status, action_type, record_id, and timestamp.
    empty_state: No actions recorded yet.

  - surface_type: operations_panel
    renderer: OpsPanel
    data_source: ingest_records, score_records
    section: operations
    expected_data_shape: Trigger buttons for ingest and score; activity log strings.
    empty_state: Ready. No recent operations.

  - surface_type: agent_chat_panel
    renderer: AgentChatPanel
    data_source: agent_chat, get_agent_conversation
    section: agent_runtime
    expected_data_shape: Persisted user/assistant messages plus visible tool activity.
    empty_state: No conversation yet.

  - surface_type: workspace_panel
    renderer: WorkspacePanel
    data_source: workspace_widgets
    section: dashboard_workspace
    expected_data_shape: Persisted workspace_widgets rows rendered by generic WidgetRenderer.
    empty_state: No widgets yet. Ask the agent to pin scored records to the workspace.

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------

providers:
  record_sources:
    - name: fixture
      class: FixtureRecordProvider
      interface: RecordProvider
      source: deterministic in-code fixture list (no external calls)
      current_status: planned
      notes: >
        Returns a fixed set of demo records on every call. Used by default in CI and
        local dev. Proves the provider interface without real data sources.

  persistence:
    - name: postgres_sqlalchemy
      current_status: planned
      tables:
        - provider_runs
        - raw_records
        - normalized_records
        - record_scores
        - record_actions
        - record_action_events
        - notification_previews
        - conversations
        - conversation_messages
        - workspace_widgets

# ---------------------------------------------------------------------------
# Adapters
# ---------------------------------------------------------------------------

adapters:
  - name: normalized_dto_from_raw
    purpose: Convert raw provider record payload into the stable NormalizedRecordDTO shape.
    normalized_shape:
      - external_id
      - source
      - title
      - category
      - value
      - ingested_at
      - raw_payload

  - name: scoring_adapter
    purpose: Convert NormalizedRecordDTO into ScoredRecordDTO with fit score, label, drivers, risks, and recommendation.
    output_shape:
      - fit         # float 0..1
      - label       # high / medium / low
      - recommendation  # accept / review / skip
      - explanation:
          - fit_score
          - summary
          - drivers    # list[str]
          - risks      # list[str]

  - name: notification_preview_adapter
    purpose: Convert the latest scored record into a preview-only notification payload with no external delivery.
    output_shape:
      - title
      - score
      - label
      - recommendation
      - summary
      - drivers
      - risks
      - available_actions

# ---------------------------------------------------------------------------
# Run History
# ---------------------------------------------------------------------------

run_history:
  enabled: true
  table_name: provider_runs
  tracked_fields:
    - provider_name
    - started_at
    - finished_at
    - status       # running / complete / error
    - stats        # JSON: raw_inserted, normalized_inserted
    - error        # nullable string
  frontend_surface: run_history_table

# ---------------------------------------------------------------------------
# Notification / Action Loop
# ---------------------------------------------------------------------------

notification_actions:
  - name: record_decision
    trigger: user clicks Accept / Skip / Save on a scored record
    delivery_channel: preview  # no-op delivery adapter; no external send
    delivery_mode: preview_only
    decision_states:
      - pending
      - accepted
      - skipped
      - saved
    dedupe_key: record_id + action_type
    persistence_table: record_actions
    history_table: record_action_events
    preview_table: notification_previews

# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------

workflows:
  - name: ingest_and_score
    trigger_examples:
      - Click Ingest button in ops panel
      - POST /ingest then POST /score
    steps:
      - call FixtureRecordProvider.fetch()
      - write provider_runs row (running)
      - insert raw_records
      - normalize raw_records -> normalized_records via normalized_dto_from_raw
      - update provider_runs row (complete, stats)
      - call scoring_adapter on each normalized record
      - write record_scores
    mutation_behavior: writes provider_runs, raw_records, normalized_records, record_scores
    current_status: planned

  - name: view_results
    trigger_examples:
      - Load /records/scored in browser
      - GET /records/scored
    steps:
      - fetch list_scored_records ordered by fit desc
      - render scored_records_table with action_status_column
    mutation_behavior: read_only
    current_status: planned

  - name: preview_notifications
    trigger_examples:
      - Click Preview Notifications in ops panel
      - POST /notifications/previews
    steps:
      - select latest scored records
      - build deterministic preview payloads with summary, reasons, risks, and available actions
      - upsert notification_previews rows
      - render notification_preview_panel
    mutation_behavior: writes notification_previews
    current_status: planned

  - name: record_action_decision
    trigger_examples:
      - Click Accept / Skip / Save on a scored record row
      - POST /records/{id}/action
    steps:
      - validate action_type enum
      - upsert record_actions row with dedupe_key
      - append record_action_events history row
      - return updated status
    mutation_behavior: writes record_actions and record_action_events
    current_status: planned

  - name: agent_chat_tool_loop
    trigger_examples:
      - Ask "score the records" in the Agent Runtime panel
      - POST /agent/chat
    steps:
      - persist user message
      - call scripted agent provider
      - execute requested deterministic tool
      - persist tool event
      - persist assistant response
      - return conversation messages and tool activity
    mutation_behavior: writes conversations and conversation_messages; may call declared deterministic tools
    current_status: planned

# ---------------------------------------------------------------------------
# Seed Data
# ---------------------------------------------------------------------------

seed_data:
  fixture_provider_records: backend/app/providers/fixture/records.py
  notes: >
    The FixtureRecordProvider returns a hardcoded list of demo records.
    No JSON seed files required — records live in code so tests are fully
    self-contained.

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

tests:
  backend:
    unit:
      - backend/tests/test_fixture_provider.py    # provider returns expected records
      - backend/tests/test_adapter.py              # raw -> normalized DTO correctness
      - backend/tests/test_scoring.py              # deterministic score output for known inputs
      - backend/tests/test_run_history.py          # run row created on ingest call
      - backend/tests/test_action_persistence.py   # pending/accepted/skipped/saved transitions
      - backend/tests/test_notification_previews.py # preview-only notification payloads
      - backend/tests/test_agent_runtime.py        # scripted provider, tools, persistence
      - backend/tests/test_workspace.py            # workspace widget validation and persistence
    integration:
      - backend/tests/integration/test_ingest_flow.py   # full ingest: provider -> normalize -> run row
      - backend/tests/integration/test_score_flow.py    # full score: normalized -> scored output
      - backend/tests/integration/test_notification_flow.py # previews and action history APIs
      - backend/tests/integration/test_agent_flow.py # chat endpoint, tool flow, conversation history
      - backend/tests/integration/test_workspace_flow.py # workspace routes and persistence
  frontend:
    playwright:
      - frontend/e2e/ingest-and-score.spec.ts  # trigger ingest -> run row appears -> trigger score -> scored record appears
  expectations:
    no_live_provider_in_tests: true
    no_live_llm_in_tests: true
    deterministic_fixture_data: true
    all_tests_runnable_with_docker_compose_db: true
  commands:
    backend: pytest
    frontend_build: npm run build
    frontend_lint: npm run lint
    e2e: npm run test:e2e

# ---------------------------------------------------------------------------
# Future Extensions
# ---------------------------------------------------------------------------

future_extensions:
  providers:
    - real_http_source_provider
    - csv_import_provider
  shell_modules:
    - agent_runtime_full   # full chat facade over scoring capabilities
    - observability_debug  # Prometheus metrics + read-only debug MCP
  features:
    - bulk_rescore_with_diff
    - action_export_csv
    - second_domain_pack_generation_dry_run

compatibility_gaps:
  - FixtureRecordProvider is in-code only; no offline JSON directory yet.
  - ScoredRecordDTO explanation shape is minimal compared to AIJobRadar; can be extended.
  - Notification delivery is preview-only; no real Telegram/email/Slack channel is wired.
  - Agent Runtime provider is scripted only; no live LLM provider is configured.
  - Dashboard/Workspace Module is generic only; Business Insight-specific widgets are not generated.
  - Frontend tests are Playwright only; no unit test suite planned for v0.1.
