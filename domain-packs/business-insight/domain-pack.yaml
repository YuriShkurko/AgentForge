      - frontend/e2e/agent-remove-widget.spec.ts
      - frontend/e2e/dashboard-clean-layout.spec.ts
      - frontend/e2e/dashboard-presentation.spec.ts
  expectations:
    no_live_llm_or_api_dependency_in_tests: true
    deterministic_demo_or_mock_data: true
    scripted_llm_provider_for_agent_e2e: true
    compatibility_validation_covered: true
