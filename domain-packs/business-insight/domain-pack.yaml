    frontend_format_check: npm run format:check

compatibility_gaps:
  - Locus scan and impact currently fail on backend/tmp_pytest_run access denied; targeted search was used instead.
  - Some widget empty-state exact strings need verification from individual renderer files.
  - The Domain Pack is documentation only; runtime still uses Python/TypeScript registries as source of truth.
  - Demo business signal tools are implemented as deterministic functions, not separate provider classes.
  - Business health local presence and competitive position include baselines until real local/competitor provider data is connected.
  - Money-flow is demo/offline only in current implementation.

