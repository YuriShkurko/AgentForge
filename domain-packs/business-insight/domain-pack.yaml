    e2e:
      - backend/tests/e2e/test_full_flow.py
  frontend:
    unit:
      - frontend/src/components/agent/widgets/__tests__/WidgetRenderer.test.tsx
      - frontend/src/lib/__tests__/workspaceBlackboard.test.ts
      - frontend/src/lib/__tests__/dashboardSections.test.ts
      - frontend/src/lib/__tests__/useAgentChat.reducer.test.ts
    playwright:
      - frontend/e2e/agent-business-insight-tools.spec.ts
      - frontend/e2e/agent-demo-signal-tools.spec.ts
      - frontend/e2e/agent-action-plan-tools.spec.ts
