    - scripts/seed_sim_lager_ale.py

tests:
  backend:
    unit:
      - backend/tests/unit/test_agent_tools.py
      - backend/tests/unit/test_guardrails.py
      - backend/tests/unit/test_scripted_provider.py
      - backend/tests/unit/test_comparison_service.py
