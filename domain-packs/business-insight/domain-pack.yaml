name: business-insight
display_name: Business Insight
version: 0.1.0
extracted_from:
  repo: MicroSaas
  date: 2026-05-05
  sources:
    - backend/app/agent/tools.py
    - backend/app/agent/system_prompt.py
    - backend/app/providers/*
    - backend/app/llm/*
    - backend/app/services/*
    - backend/app/schemas/*
    - frontend/src/components/agent/WidgetRenderer.tsx
    - frontend/src/lib/dashboardSections.ts
    - backend/tests
    - frontend/e2e

app_archetype: agent_dashboard_app

required_shell_modules:
  - agent
  - workspace
  - provider_adapter
  - test

optional_shell_modules:
  - notification_action
  - observability_debug
  - pipeline

domain:
  domain_name: Business Insight
  app_type: agentic_business_dashboard
  target_users:
    - local_smb_owner
    - local_smb_manager
  product_purpose: >
    Help SMBs turn reviews, competitor context, and business signals into dashboards,
    explanations, opportunities, and action plans.
  main_user_goals:
    - understand_customer_feedback
    - compare_competitors
    - monitor_business_health
    - understand_signal_timeline
    - inspect_money_flow
    - find_opportunities
    - create_action_plans
    - build_present_dashboards

agent_shell_contract:
  chat: true
  streaming_sse: true
  tool_calling: true
  persistent_conversations: true
  persistent_workspace_widgets: true
  workspace_events:
    - widget_added
    - widget_removed
    - dashboard_cleared
    - widget_reordered
  dashboard_layout:
    sections:
      - overview
      - trends
      - issues
      - evidence
      - actions
    supports_reorder: true
    supports_presentation_mode: true
  guardrails: true
  scripted_llm_testing: true

tools:
  - name: get_dashboard
    purpose: Get overview KPIs, AI summary, top complaints, top praise, risks, and actions.
    input_summary: No arguments.
    output_shape:
      fields: [place_id, business_name, business_type, address, avg_rating, total_reviews, top_complaints, top_praise, ai_summary, action_items, risk_areas, recommended_focus, analysis_created_at, last_updated_at]
    allowed_widget_types: [summary_card, metric_card]
    mutates_state: false
    data_mode: real_or_mock
    deterministic_test_safe: true
    implementation_status: implemented

  - name: query_reviews
    purpose: Retrieve customer reviews with optional rating, keyword, date, and limit filters.
    input_summary: min_rating, max_rating, keyword, date_from, date_to, limit.
    output_shape:
      fields: [count, reviews]
      review_fields: [id, rating, text, author, published_at]
    allowed_widget_types: [review_list]
    mutates_state: false
    data_mode: real_mock_or_offline
    deterministic_test_safe: true
    implementation_status: implemented

  - name: run_analysis
    purpose: Run AI analysis on current reviews and return the normalized result.
    input_summary: No arguments.
    output_shape:
      fields: [summary, top_complaints, top_praise, action_items, risk_areas, recommended_focus]
    allowed_widget_types: [insight_list, summary_card]
    mutates_state: true
    data_mode: real_or_mock_llm
    deterministic_test_safe: true_with_mock_or_scripted_provider
    implementation_status: implemented

  - name: compare_competitors
    purpose: Generate comparison of current business against linked competitors.
    input_summary: No arguments; uses linked competitors for current business/user.
    output_shape:
      fields: [target, competitors, comparison_summary, strengths, weaknesses, opportunities]
    allowed_widget_types: [comparison_card, comparison_chart]
    mutates_state: true
    data_mode: real_or_mock_llm
    deterministic_test_safe: true_with_mock_or_scripted_provider
    implementation_status: implemented

  - name: get_review_trends
    purpose: Compare review count and average rating for a current period versus prior period.
    input_summary: period enum 7d, 14d, 30d.
    output_shape:
      fields: [period, current, previous, change_pct]
    allowed_widget_types: [trend_indicator, metric_card]
    mutates_state: false
    data_mode: real_mock_or_offline
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_review_series
    purpose: Return chart-ready daily review series for count, average rating, or both.
    input_summary: days enum 3, 7, 14, 30; metric enum count, avg_rating, both.
    output_shape:
      fields: [period, days, group_by, metric, from, to, series, summary]
      series_fields: [date, count, avg_rating]
    allowed_widget_types: [line_chart]
    mutates_state: false
    data_mode: real_mock_or_offline
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_rating_distribution
    purpose: Return star-rating counts and percentages for recent reviews.
    input_summary: days clamped to 7-90.
    output_shape:
      fields: [period, days, bars, slices, total]
    allowed_widget_types: [bar_chart, donut_chart, pie_chart]
    mutates_state: false
    data_mode: real_mock_or_offline
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_top_issues
    purpose: Return ranked review issues with severity and representative quote.
    input_summary: limit clamped 1-10; days clamped 7-90.
    output_shape:
      fields: [issues, bars, period, total_reviews_analyzed]
      issue_fields: [theme, count, avg_rating, severity, representative_quote]
    allowed_widget_types: [horizontal_bar_chart, bar_chart, insight_list]
    mutates_state: false
    data_mode: real_mock_or_offline
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_review_insights
    purpose: Return synthesized review themes for positive, negative, or balanced questions.
    input_summary: focus enum negative, positive, balanced; period enum this_week, this_month, last_month, past_7d, past_30d, past_90d; limit.
    output_shape:
      fields: [summary, period, focus, review_count, avg_rating, themes, bars, examples, reviews, limitation, recommended_focus]
      conditional_fields: [top_praise, top_complaints, issues]
    allowed_widget_types: [summary_card, insight_list]
    mutates_state: false
    data_mode: real_mock_or_offline
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_review_change_summary
    purpose: Compare two review windows for rating/count deltas and theme shifts.
    input_summary: current_period and previous_period enums.
    output_shape:
      fields: [summary, current_period, previous_period, current, previous, rating_delta, count_delta, current_themes, previous_themes, limitation, recommended_focus]
    allowed_widget_types: [comparison_chart, comparison_card]
    mutates_state: false
    data_mode: real_mock_or_offline
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_business_health
    purpose: Compute Business Insight health score from reviews, analysis, momentum, local readiness baseline, and cached competitor comparison.
    input_summary: No arguments.
    output_shape:
      fields: [score, label, summary, sub_scores, drivers, risks, opportunities, source, is_demo, freshness, confidence, limitations]
    allowed_widget_types: [health_score, summary_card]
    mutates_state: false
    data_mode: real_review_analysis_plus_baselines
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_signal_timeline
    purpose: Build a timeline of review volume, rating, and theme shifts.
    input_summary: days enum 7, 14, 30, 60, 90.
    output_shape:
      fields: [period, events, summary, source, is_demo, freshness, confidence, limitations]
      event_fields: [id, date, type, severity, title, summary, impact, evidence]
    allowed_widget_types: [signal_timeline, summary_card]
    mutates_state: false
    data_mode: real_review_data
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_sales_summary
    purpose: Return deterministic demo POS-lite sales signals.
    input_summary: No arguments.
    output_shape:
      fields: [label, summary, metrics, items, recommendation, source, is_demo, freshness, confidence, limitations]
    allowed_widget_types: [sales_summary, summary_card]
    mutates_state: false
    data_mode: demo_offline
    deterministic_test_safe: true
    implementation_status: implemented_demo_provider

  - name: get_financial_flow
    purpose: Return deterministic demo revenue-to-profit money flow.
    input_summary: No arguments.
    output_shape:
      fields: [label, period, currency, revenue, cogs, gross_profit, operating_expenses, net_profit, gross_margin_pct, net_margin_pct, summary, source, is_demo, freshness, confidence, limitations]
    allowed_widget_types: [money_flow, summary_card]
    mutates_state: false
    data_mode: demo_offline
    deterministic_test_safe: true
    implementation_status: implemented_demo_provider

  - name: get_operations_summary
    purpose: Return deterministic demo operations risk signals.
    input_summary: No arguments.
    output_shape:
      fields: [label, score, summary, metrics, items, recommendation, source, is_demo, freshness, confidence, limitations]
    allowed_widget_types: [operations_risk, summary_card]
    mutates_state: false
    data_mode: demo_offline
    deterministic_test_safe: true
    implementation_status: implemented_demo_provider

  - name: get_local_presence_summary
    purpose: Return deterministic demo local presence and listing readiness signals.
    input_summary: No arguments.
    output_shape:
      fields: [label, score, summary, metrics, items, recommendation, source, is_demo, freshness, confidence, limitations]
    allowed_widget_types: [local_presence_card, summary_card]
    mutates_state: false
    data_mode: demo_offline
    deterministic_test_safe: true
    implementation_status: implemented_demo_provider

  - name: get_social_signal_summary
    purpose: Return deterministic demo social/content signal summary.
    input_summary: No arguments.
    output_shape:
      fields: [label, summary, metrics, items, recommendation, source, is_demo, freshness, confidence, limitations]
    allowed_widget_types: [social_signal, summary_card]
    mutates_state: false
    data_mode: demo_offline
    deterministic_test_safe: true
    implementation_status: implemented_demo_provider

  - name: get_opportunities
    purpose: Return prioritized opportunities from review evidence, analysis, and enabled demo signals.
    input_summary: No arguments.
    output_shape:
      fields: [summary, opportunities, source, is_demo, freshness, confidence, limitations, review_count, recent_review_count]
    allowed_widget_types: [opportunity_list, insight_list, summary_card]
    mutates_state: false
    data_mode: real_review_analysis_plus_demo_signals
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_action_plan
    purpose: Return ranked actions from top opportunities with owners and metrics to watch.
    input_summary: No arguments.
    output_shape:
      fields: [summary, actions, weekly_priorities, source, is_demo, freshness, confidence, limitations]
      action_fields: [id, rank, issue_or_opportunity, evidence, likely_cause, recommended_action, effort, impact, suggested_owner, metric_to_watch, example_response, source, is_demo]
    allowed_widget_types: [action_plan, insight_list, summary_card]
    mutates_state: false
    data_mode: real_review_analysis_plus_demo_signals
    deterministic_test_safe: true
    implementation_status: implemented

  - name: create_custom_chart_data
    purpose: Validate and package agent-derived chart/list data when no fixed tool covers the requested segmentation.
    input_summary: widget_type, labels, values, items, title_hint, notes, source_summary, uncertainty_note.
    output_shape:
      fields: [widget_type, labels, values, bars, slices, total, items, source_summary, notes, title_hint, uncertainty_note]
      error_fields: [error, message, redirect_tool, redirect_widget_type]
    allowed_widget_types: [bar_chart, horizontal_bar_chart, pie_chart, donut_chart, insight_list]
    mutates_state: false
    data_mode: derived_from_prior_tool_results
    deterministic_test_safe: true
    implementation_status: implemented
    guardrails:
      - requires_uncertainty_note_for_inferred_demographic_or_name_based_segments
      - redirects_money_flow_like_bar_charts_to_get_financial_flow

  - name: pin_widget
    purpose: Persist a compatible tool result as a workspace widget.
    input_summary: widget_type, title, source_tool, optional data.
    output_shape:
      fields: [pinned, widget_id, widget]
      error_fields: [pinned, error, allowed_widget_types, redirect_tool, redirect_widget_type]
    allowed_widget_types: []
    mutates_state: true
    data_mode: workspace_persistence
    deterministic_test_safe: true
    implementation_status: implemented

  - name: get_workspace
    purpose: List current workspace widgets and IDs.
    input_summary: No arguments.
    output_shape:
      fields: [widgets, widget_ids]
    allowed_widget_types: []
    mutates_state: false
    data_mode: workspace_persistence
    deterministic_test_safe: true
    implementation_status: implemented

  - name: remove_widget
    purpose: Remove one workspace widget by exact UUID.
    input_summary: widget_id UUID.
    output_shape:
      fields: [removed, widget_id, error]
    allowed_widget_types: []
    mutates_state: true
    data_mode: workspace_persistence
    deterministic_test_safe: true
    implementation_status: implemented

  - name: clear_dashboard
    purpose: Remove all workspace widgets for the current business/user.
    input_summary: No arguments.
    output_shape:
      fields: [cleared, removed_count, widget_ids]
    allowed_widget_types: []
    mutates_state: true
    data_mode: workspace_persistence
    deterministic_test_safe: true
    implementation_status: implemented

  - name: duplicate_widget
    purpose: Copy an existing workspace widget row directly.
    input_summary: widget_id UUID.
    output_shape:
      fields: [duplicated, widget_id, source_widget_id, widget, error]
    allowed_widget_types: []
    mutates_state: true
    data_mode: workspace_persistence
    deterministic_test_safe: true
    implementation_status: implemented

  - name: set_dashboard_order
    purpose: Set exact dashboard widget order using all current widget IDs.
    input_summary: widget_ids array of UUIDs.
    output_shape:
      fields: [reordered, widget_ids, widgets, error, missing_widget_ids, omitted_widget_ids, current_widget_ids]
    allowed_widget_types: []
    mutates_state: true
    data_mode: workspace_persistence
    deterministic_test_safe: true
    implementation_status: implemented

tool_widget_compatibility:
  get_dashboard: [summary_card, metric_card]
  query_reviews: [review_list]
  run_analysis: [insight_list, summary_card]
  compare_competitors: [comparison_card, comparison_chart]
  get_review_trends: [trend_indicator, metric_card]
  get_review_series: [line_chart]
  get_rating_distribution: [bar_chart, donut_chart, pie_chart]
  get_top_issues: [horizontal_bar_chart, bar_chart, insight_list]
  get_review_insights: [summary_card, insight_list]
  get_review_change_summary: [comparison_chart, comparison_card]
  get_business_health: [health_score, summary_card]
  get_signal_timeline: [signal_timeline, summary_card]
  get_sales_summary: [sales_summary, summary_card]
  get_financial_flow: [money_flow, summary_card]
  get_operations_summary: [operations_risk, summary_card]
  get_local_presence_summary: [local_presence_card, summary_card]
  get_social_signal_summary: [social_signal, summary_card]
  get_opportunities: [opportunity_list, insight_list, summary_card]
  get_action_plan: [action_plan, insight_list, summary_card]
  create_custom_chart_data: [bar_chart, horizontal_bar_chart, pie_chart, donut_chart, insight_list]

widgets:
  - widget_type: metric_card
    renderer: MetricCard
    compatible_source_tools: [get_dashboard, get_review_trends]
    section: overview
    expected_data_shape: Metric-like data; renderer accepts generic record.
    empty_state: Renderer-level fallback, needs_verification for exact text.
    implementation_status: implemented
  - widget_type: summary_card
    renderer: SummaryCard
    compatible_source_tools: [get_dashboard, run_analysis, get_review_insights, get_business_health, get_signal_timeline, get_sales_summary, get_financial_flow, get_operations_summary, get_local_presence_summary, get_social_signal_summary, get_opportunities, get_action_plan]
    section: overview_or_actions
    expected_data_shape: summary plus optional issues, praise, opportunities, action_items, recommended_focus, limitation.
    empty_state: "No summary data available."
    implementation_status: implemented
  - widget_type: insight_list
    renderer: SummaryCard
    compatible_source_tools: [run_analysis, get_top_issues, get_review_insights, get_opportunities, get_action_plan, create_custom_chart_data]
    section: issues_or_actions
    expected_data_shape: themes/items/issues/action-oriented lists.
    empty_state: SummaryCard fallback.
    implementation_status: implemented
  - widget_type: review_list
    renderer: ReviewListWidget
    compatible_source_tools: [query_reviews]
    section: evidence
    expected_data_shape: reviews array with id, rating, text, author, published_at.
    empty_state: "No reviews found."
    implementation_status: implemented
  - widget_type: comparison_card
    renderer: ComparisonWidget
    compatible_source_tools: [compare_competitors, get_review_change_summary]
    section: trends
    expected_data_shape: comparison_summary/summary, strengths, weaknesses, opportunities, or current/previous period stats.
    empty_state: "No comparison data available."
    implementation_status: implemented
  - widget_type: trend_indicator
    renderer: TrendIndicator
    compatible_source_tools: [get_review_trends]
    section: overview
    expected_data_shape: period, current, previous, change_pct.
    empty_state: Renderer-level fallback, needs_verification for exact text.
    implementation_status: implemented
  - widget_type: line_chart
    renderer: LineChart
    compatible_source_tools: [get_review_series]
    section: trends
    expected_data_shape: series array with date, count, avg_rating.
    empty_state: "No chart data available."
    implementation_status: implemented
  - widget_type: bar_chart
    renderer: BarChart
    compatible_source_tools: [get_rating_distribution, get_top_issues, create_custom_chart_data]
    section: trends
    expected_data_shape: bars or labels/values.
    empty_state: "No chart data available."
    implementation_status: implemented
  - widget_type: horizontal_bar_chart
    renderer: HorizontalBarChart
    compatible_source_tools: [get_top_issues, create_custom_chart_data]
    section: trends
    expected_data_shape: bars with label/value.
    empty_state: "No chart data available."
    implementation_status: implemented
  - widget_type: pie_chart
    renderer: DonutChart
    compatible_source_tools: [get_rating_distribution, create_custom_chart_data]
    section: issues
    expected_data_shape: slices or labels/values.
    empty_state: "No chart data available."
    implementation_status: implemented
  - widget_type: donut_chart
    renderer: DonutChart
    compatible_source_tools: [get_rating_distribution, create_custom_chart_data]
    section: issues
    expected_data_shape: slices or labels/values.
    empty_state: "No chart data available."
    implementation_status: implemented
  - widget_type: comparison_chart
    renderer: ComparisonChart
    compatible_source_tools: [compare_competitors, get_review_change_summary]
    section: trends
    expected_data_shape: comparison or current-vs-previous data.
    empty_state: Renderer-level fallback, needs_verification for exact text.
    implementation_status: implemented
  - widget_type: health_score
    renderer: HealthScore
    compatible_source_tools: [get_business_health]
    section: overview
    expected_data_shape: score, sub_scores, drivers, risks, opportunities, confidence, limitations.
    empty_state: Renderer-level fallback, needs_verification for exact text.
    implementation_status: implemented
  - widget_type: signal_timeline
    renderer: SignalTimeline
    compatible_source_tools: [get_signal_timeline]
    section: trends
    expected_data_shape: period, events, summary, confidence, limitations.
    empty_state: Renderer-level fallback, needs_verification for exact text.
    implementation_status: implemented
  - widget_type: sales_summary
    renderer: SignalSummary
    compatible_source_tools: [get_sales_summary]
    section: overview
    expected_data_shape: label, summary, metrics, items, recommendation, is_demo.
    empty_state: "No signal data available."
    implementation_status: implemented
  - widget_type: operations_risk
    renderer: SignalSummary
    compatible_source_tools: [get_operations_summary]
    section: issues
    expected_data_shape: label, score, summary, metrics, items, recommendation, is_demo.
    empty_state: "No signal data available."
    implementation_status: implemented
  - widget_type: local_presence_card
    renderer: SignalSummary
    compatible_source_tools: [get_local_presence_summary]
    section: overview
    expected_data_shape: label, score, summary, metrics, items, recommendation, is_demo.
