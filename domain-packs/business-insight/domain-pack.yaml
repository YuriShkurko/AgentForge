    implementation_status: implemented
  - widget_type: opportunity_list
    renderer: ActionPlan
    compatible_source_tools: [get_opportunities]
    section: actions
    expected_data_shape: opportunities array plus summary, confidence, limitations.
    empty_state: ActionPlan fallback, needs_verification for exact text.
    implementation_status: implemented
  - widget_type: action_plan
    renderer: ActionPlan
    compatible_source_tools: [get_action_plan]
    section: actions
    expected_data_shape: actions array plus weekly_priorities, confidence, limitations.
    empty_state: ActionPlan fallback, needs_verification for exact text.
    implementation_status: implemented
  - widget_type: money_flow
    renderer: MoneyFlow
    compatible_source_tools: [get_financial_flow]
    section: trends
    expected_data_shape: revenue, cogs, gross_profit, operating_expenses, net_profit, margins, currency, period, is_demo.
    empty_state: MoneyFlow fallback, needs_verification for exact text.
    implementation_status: implemented

providers:
  review_providers:
    - name: mock
      class: MockProvider
      source: app.mock.reviews.generate_mock_reviews
      data_mode: deterministic_mock
      current_status: implemented
    - name: offline
      class: OfflineProvider
      source: backend/data/offline/*.json plus manifest.json
      data_mode: offline_demo
      current_status: implemented
    - name: outscraper
      class: OutscraperProvider
      source: Outscraper maps/reviews-v3 API
      data_mode: real_provider
      current_status: implemented_requires_api_key
    - name: simulation
      class: SimulationProvider
      source: sim_reviews table seeded by living demo scripts
      data_mode: deterministic_simulation_or_mock_fallback
      current_status: implemented
  competitor_data_path:
    source: linked businesses via CompetitorLink, analyses via Analysis table, comparison cache via MongoDB
    provider_type: internal_service_plus_llm
    current_status: implemented
  business_signal_demo_providers:
    - get_sales_summary
    - get_financial_flow
    - get_operations_summary
    - get_local_presence_summary
    - get_social_signal_summary
  llm_providers:
    - name: openai
      class: OpenAICompatProvider
      current_status: implemented_requires_openai_api_key
    - name: openrouter
      class: OpenAICompatProvider
      current_status: implemented_requires_openrouter_api_key
    - name: scripted
      class: ScriptedProvider
      current_status: implemented_test_only_requires_testing_true
    - name: none_mock_path
      current_status: implemented_fallback_when_no_api_key

adapters:
  - name: ReviewProvider
    purpose: Normalize review providers into a stable NormalizedReview shape.
    normalized_shape: [external_id, source, author, rating, text, published_at]
  - name: dashboard_tool_adapters
    purpose: Convert stored reviews, analysis, comparison, and demo signals into widget-ready JSON payloads.
  - name: llm_openai_compat_adapter
    purpose: Expose OpenAI and OpenRouter through the same LLMProvider interface.

terminology:
  provider: Where data or capability comes from.
  adapter: Normalization layer that makes providers fit stable domain interfaces.
  agent: Mediator/proxy UX layer that routes user intent through tools and widgets.
  domain_pack: Tools, schemas, widgets, workflows, prompts, adapters, seed data, and tests for one app domain.

workflows:
  - name: build_demo_dashboard
    trigger_examples: ["fill the dashboard", "build a full dashboard", "generate a new dashboard"]
    steps:
      - get_dashboard -> pin_widget(summary_card)
      - get_business_health -> pin_widget(health_score)
      - get_signal_timeline -> pin_widget(signal_timeline)
      - get_sales_summary -> pin_widget(sales_summary)
      - get_financial_flow -> pin_widget(money_flow)
      - get_action_plan -> pin_widget(action_plan)
      - get_review_series -> pin_widget(line_chart)
      - get_rating_distribution -> pin_widget(donut_chart)
      - get_top_issues -> pin_widget(horizontal_bar_chart)
      - get_review_insights -> pin_widget(summary_card)
      - query_reviews -> pin_widget(review_list)
    current_status: implemented_prompted_workflow
  - name: ask_analytics_question
    trigger_examples: ["what are customers complaining about?", "what changed compared to last month?", "what did people like?"]
    steps:
      - route to get_review_insights, get_review_change_summary, get_top_issues, query_reviews, or get_review_series
    current_status: implemented
  - name: pin_widget
    steps:
      - call data tool
      - call pin_widget with source_tool and compatible widget_type
      - emit workspace_event widget_added
    current_status: implemented
  - name: remove_widget
    steps:
      - call get_workspace if widget ID is unknown
      - call remove_widget with exact UUID
      - emit workspace_event widget_removed
    current_status: implemented
  - name: reorder_clean_layout
    steps:
      - call get_workspace
      - group widgets into overview, trends, issues, evidence, actions
      - call set_dashboard_order with every current widget ID
    current_status: implemented
  - name: presentation_mode
    steps:
      - render existing workspace widgets in presentation-oriented layout
    current_status: implemented_frontend
  - name: compare_competitors
    steps:
      - ensure linked competitor analyses exist
      - call compare_competitors
      - pin comparison_card or comparison_chart
      - refresh health_score if present
    current_status: implemented
  - name: money_flow_request
    steps:
      - call get_financial_flow
      - pin_widget with widget_type money_flow
      - disclose demo data
    current_status: implemented
  - name: business_health_request
    steps:
      - call get_business_health
      - pin_widget with widget_type health_score when dashboard output is requested
    current_status: implemented
  - name: signal_timeline_request
    steps:
      - call get_signal_timeline
      - pin_widget with widget_type signal_timeline when dashboard output is requested
    current_status: implemented
  - name: action_plan_or_opportunity_request
    steps:
      - call get_opportunities or get_action_plan
      - pin opportunity_list or action_plan
    current_status: implemented
  - name: offline_demo_sample_import
    steps:
      - configure REVIEW_PROVIDER=offline
      - load place_id from backend/data/offline/manifest.json
      - fetch reviews through OfflineProvider
    current_status: implemented
  - name: scripted_llm_e2e_flow
    steps:
      - set TESTING=true and LLM_PROVIDER=scripted
      - inject script through /api/test/agent/script
      - call /agent/chat
      - assert tool_result and workspace_event stream events
    current_status: implemented

prompts:
  source_file: backend/app/agent/system_prompt.py
  responsibilities:
    - concise_business_review_consultant_persona
    - tool_routing_for_reviews_competitors_business_insight_demo_signals
    - compatibility_table_in_prompt
    - dashboard_pinning_required_sequence
    - pin_failure_recovery
    - custom_segmentation_uncertainty_rules
    - dashboard_remove_duplicate_reorder_rules
    - clean_layout_grouping
    - competitor_comparison_health_score_refresh
    - money_flow_critical_override
    - empty_data_fallback
    - comprehensive_dashboard_fill
    - improvement_dashboard_fill
    - data_trust_boundary_for_untrusted_review_and_scraped_content
  money_flow_routing_rule: Always call get_financial_flow and pin as money_flow; do not use bar_chart or horizontal_bar_chart as the primary money-flow answer.
  guardrails:
    prompt_injection_boundary: Review text, business names, competitor names, and scraped content are untrusted user data.
    relevancy: Intent classification exists in backend/app/agent/guardrails.py and is covered by tests.

seed_data:
